[package]
name = "migi-cambus"
version = "0.1.0"
edition = "2021"

[dependencies]
migi-core = { path = "../migi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
migi-chainlog = { path = "../migi-chainlog" }
